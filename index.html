<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn 1 Thing</title>
<link rel="preload" as="image" href="bg/poster.jpg">
<link rel="preload" as="image" href="ui/tv.webp">
<link rel="preload" as="font" href="fonts/InstrumentSerif-Regular.ttf" type="font/ttf" crossorigin>
<style>
  @font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Regular.ttf) format("truetype");font-display:block}
  html,body{margin:0;height:100%;background:#2a1f17;overflow:hidden}

  /* moving film grain over everything */
  #grain{position:fixed;inset:-50%;z-index:20;pointer-events:none;background:url(ui/grain.png);opacity:.09;mix-blend-mode:overlay;animation:grain .9s steps(6) infinite}
  @keyframes grain{0%{transform:translate(0,0)}17%{transform:translate(-6%,4%)}33%{transform:translate(5%,-7%)}50%{transform:translate(-3%,8%)}67%{transform:translate(8%,2%)}83%{transform:translate(-8%,-4%)}100%{transform:translate(0,0)}}

  /* fullscreen button, fixed to the window's top-right corner */
  #fs{position:fixed;top:20px;right:20px;z-index:21;width:28px;height:28px;padding:0;border:0;background:none;color:#fff;cursor:pointer;opacity:.9;transition:opacity .2s,transform .2s}
  #fs:hover{opacity:1;transform:scale(1.08)}
  #fs svg{width:100%;height:100%;display:block}
  #fs[hidden]{display:none}
  #stage{position:fixed;inset:0;overflow:hidden}
  /* on tall/narrow screens the scene shrinks; wall and table tones continue above and below it */
  #stage.fit{background:linear-gradient(to bottom,#9d865b 0%,#a68a62 46%,#5e381c 54%,#3f2410 100%)}
  #stage.fit.night{background:linear-gradient(to bottom,#4a3a2a 0%,#55432f 46%,#3a2414 54%,#24150a 100%)}

  /* scene laid out in source-video pixels (1920×1080), scaled to the viewport */
  #scene{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  #stage.fit #scene{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 10%,#000 96%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 10%,#000 96%,transparent)}

  /* background loops: one per pet × drink × time; the active one sits on top and fades in */
  #bgs{position:absolute;inset:0;z-index:0}
  #poster,.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .bg{opacity:0;transition:opacity .8s ease}
  .bg.show{opacity:1}

  /* ---------- TV (still image over the background) ----------
     tv.webp is 1279×678; its screen is a transparent hole at 207–908 × 37–509. */
  #tv{position:absolute;left:316px;top:247px;width:1279px;height:678px;z-index:1}
  #tv .png{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none;z-index:2}
  #screen{position:absolute;left:205px;top:35px;width:706px;height:477px;overflow:hidden;background:#0b0b0a;z-index:1;--zoom:1}
  #yt{position:absolute;top:50%;left:50%;height:calc(100% * var(--zoom));aspect-ratio:16/9;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .4s}
  #yt.on{opacity:1}
  #yt iframe{width:100%;height:100%;border:0;display:block}
  #static{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:0;transition:opacity .25s}
  #static.on{opacity:.5}
  #screen::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 50px 8px rgba(0,0,0,.45)}
  /* clicks on the screen (the player never gets the mouse, so YouTube never shows its UI) */
  #tap{position:absolute;left:207px;top:37px;width:702px;height:473px;z-index:3;border:0;padding:0;background:none;cursor:pointer}
  #osd{position:absolute;left:240px;top:62px;z-index:3;width:44px;height:44px;color:#9ef59a;filter:drop-shadow(0 0 6px rgba(158,245,154,.8));opacity:0;transition:opacity .3s;pointer-events:none}
  #osd.on{opacity:.9;animation:blink 1.6s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}
  /* big "next" button, with its pressed artwork shown briefly on press */
  #next{position:absolute;left:952px;top:384px;width:164px;height:84px;z-index:3;border:0;padding:0;background:none;cursor:pointer;border-radius:42px;-webkit-tap-highlight-color:transparent}
  #pressed{position:absolute;left:951.5px;top:365px;width:172.8px;height:122.7px;z-index:2;pointer-events:none;opacity:0}
  #pressed.on{opacity:1}
  #tap:focus,#next:focus{outline:none}
  #next:focus-visible{box-shadow:0 0 0 4px rgba(224,104,42,.6)}

  /* ---------- Toggles ----------
     Built in the artwork's own pixels (756×424) and scaled into the scene. */
  .tg{position:absolute;z-index:2;width:756px;height:424px;transform:scale(.1614);transform-origin:0 0;padding:0;border:0;background:none;cursor:pointer;
      -webkit-tap-highlight-color:transparent;filter:drop-shadow(0 18px 22px rgba(40,22,8,.35));transition:opacity .6s}
  .tg::before{content:"";position:absolute;inset:-120px -60px}
  .tg img{position:absolute;display:block;pointer-events:none;user-select:none}
  .tg .base{left:35px;top:36px;width:685px;height:353px}
  .tg .ring{left:0;top:0;width:756px;height:424px}
  .tg .hint{position:absolute;top:212px;width:140px;height:140px;margin:-70px 0 0 -70px;color:#f3eadf;opacity:.55;transition:opacity .35s}
  .tg .hint.a{left:211px}
  .tg .hint.b{left:543px}
  .tg[aria-checked="false"] .hint.a,.tg[aria-checked="true"] .hint.b{opacity:0}
  .tg .knob{position:absolute;left:35px;top:45px;width:361px;height:388px;transition:transform .55s cubic-bezier(.65,0,.25,1)}
  .tg[aria-checked="true"] .knob{transform:translateX(332px)}
  .tg .knob img{left:0;top:0;width:361px;height:388px}
  .tg .icon{position:absolute;left:176px;top:167px;width:150px;height:150px;margin:-75px 0 0 -75px;transition:opacity .3s,transform .55s cubic-bezier(.65,0,.25,1)}
  .tg svg{width:100%;height:100%;display:block}
  .tg .icon.b{opacity:0;transform:rotate(-40deg) scale(.7)}
  .tg[aria-checked="true"] .icon.a{opacity:0;transform:rotate(40deg) scale(.7)}
  .tg[aria-checked="true"] .icon.b{opacity:1;transform:none}
  .tg:focus{outline:none}
  .tg:focus-visible .ring{filter:drop-shadow(0 0 14px rgba(224,104,42,.9))}
  #stage.loading .tg{opacity:.0;pointer-events:none}
  /* positions in the scene */
  #t-pet{left:178px;top:580px}
  #t-drink{left:1460px;top:838px}
  #t-time{left:1692px;top:206px}

  /* ---------- Title and duration picker ---------- */
  .serif{position:absolute;left:0;width:1920px;text-align:center;font-family:"Instrument Serif",Georgia,serif;font-weight:400;color:#f7efe5;
         letter-spacing:-.01em;text-shadow:0 2px 18px rgba(30,15,5,.45);pointer-events:none;margin:0;line-height:1;z-index:2}
  #title{top:96px;font-size:76px}
  #sub{top:873px;font-size:34px}
  #stage.loading .serif,#stage.loading #dur{opacity:0}
  .serif,#dur{transition:opacity .6s}

  /* 3-way duration toggle, built in its artwork's own pixels (1054×424) and scaled into the scene */
  #dur{position:absolute;left:838px;top:930px;width:1054px;height:424px;transform:scale(.2296);transform-origin:0 0;z-index:2;
       filter:drop-shadow(0 18px 22px rgba(40,22,8,.35))}
  #dur img{position:absolute;display:block;pointer-events:none;user-select:none}
  #dur .base{left:34px;top:35px;width:985px;height:353px}
  #dur .ring{left:0;top:0;width:1054px;height:424px}
  #dur .knob{position:absolute;left:35px;top:45px;width:361px;height:388px;transition:transform .5s cubic-bezier(.65,0,.25,1)}
  #dur .knob img{left:0;top:0;width:361px;height:388px}
  #dur[data-i="1"] .knob{transform:translateX(315px)}
  #dur[data-i="2"] .knob{transform:translateX(630px)}
  #dur .opt{position:absolute;top:0;width:351px;height:424px;padding:0;border:0;background:none;cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}
  #dur .opt:nth-of-type(1){left:0}#dur .opt:nth-of-type(2){left:351px}#dur .opt:nth-of-type(3){left:702px}
  #dur .opt img{left:50%;top:50%;transform:translate(-50%,-50%);opacity:.5;filter:invert(1) sepia(.35);transition:opacity .35s,filter .35s}
  #dur .opt[aria-checked="true"] img{opacity:.88;filter:none}
  #dur .opt:focus{outline:none}
  #dur .opt:focus-visible img{opacity:1}
  /* icon colours on the knob */
  .c-cat{color:#5a4637}.c-dog{color:#8b5a2b}.c-coffee{color:#5b3a26}.c-tea{color:#58703a}.c-day{color:#d08a18}.c-night{color:#3f4b7d}
  @media (prefers-reduced-motion:reduce){ .bg,.tg .knob,.tg .icon,#dur .knob{transition-duration:.01s} #grain{animation:none} }
</style>
</head>

<div id="stage" class="loading">
  <div id="scene">
    <div id="bgs"><img id="poster" src="bg/poster.jpg" alt=""></div>

    <div id="tv">
      <div id="screen">
        <div id="yt"><div id="ytp"></div></div>
        <canvas id="static" width="248" height="162"></canvas>
      </div>
      <img class="png" src="ui/tv.webp" alt="">
      <img id="pressed" src="ui/button-pressed.webp" alt="">
      <svg id="osd" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
      <button id="tap" aria-label="Pause or play"></button>
      <button id="next" aria-label="Next video"></button>
    </div>

    <button class="tg" id="t-pet" data-key="pet" data-a="cat" data-b="dog" role="switch" aria-checked="false" aria-label="Dog instead of cat"></button>
    <button class="tg" id="t-drink" data-key="drink" data-a="coffee" data-b="tea" role="switch" aria-checked="false" aria-label="Tea instead of coffee"></button>
    <button class="tg" id="t-time" data-key="time" data-a="day" data-b="night" role="switch" aria-checked="false" aria-label="Night instead of day"></button>

    <h1 class="serif" id="title">Learn something today</h1>
    <p class="serif" id="sub">How long do you have?</p>
    <div id="dur" role="radiogroup" aria-label="How long do you have?" data-i="0">
      <img class="base" src="ui/long-base.webp" alt="">
      <img class="ring" src="ui/long-ring.webp" alt="">
      <span class="knob"><img src="ui/knob.webp" alt=""></span>
      <button class="opt" role="radio" aria-checked="true" aria-label="1 to 5 minutes" data-bucket="Under 5 min"><img src="ui/d-1-5.webp" alt=""></button>
      <button class="opt" role="radio" aria-checked="false" aria-label="5 to 10 minutes" data-bucket="5–10 min"><img src="ui/d-5-10.webp" alt=""></button>
      <button class="opt" role="radio" aria-checked="false" aria-label="10 to 15 minutes" data-bucket="10–15 min"><img src="ui/d-10-15.webp" alt=""></button>

<script src="videos.js"></script>
<script>
(() => {
  const W = 1920, H = 1080;
  const stage = document.getElementById('stage'), scene = document.getElementById('scene');

  /* ---------- Fit: keep the TV and all toggles in view ---------- */
  const F = { x0: 170, y0: 85, x1: 1825, y1: 1035 };   // focus area (title, TV, toggles, duration picker), source pixels
  const TVC = { x: 965, y: 561 };                       // TV centre
  const fw = F.x1 - F.x0, fh = F.y1 - F.y0, fcx = (F.x0 + F.x1) / 2, fcy = (F.y0 + F.y1) / 2;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  function layout() {
    const vw = innerWidth, vh = innerHeight, m = 12;
    let s = Math.max(vw / W, vh / H), cover = true;
    if (fw * s > vw - 2 * m || fh * s > vh - 2 * m) { s = Math.min((vw - 2 * m) / fw, (vh - 2 * m) / fh); cover = false; }
    let ox, oy;
    if (cover) {
      ox = vw / 2 - TVC.x * s; oy = vh / 2 - TVC.y * s;
      ox = clamp(ox, vw - m - F.x1 * s, m - F.x0 * s); oy = clamp(oy, vh - m - F.y1 * s, m - F.y0 * s);
      ox = clamp(ox, vw - W * s, 0); oy = clamp(oy, vh - H * s, 0);
    } else { ox = vw / 2 - fcx * s; oy = vh / 2 - fcy * s; }
    scene.style.transform = `translate(${ox}px,${oy}px) scale(${s})`;
    stage.classList.toggle('fit', !cover);
  }
  addEventListener('resize', layout); layout();

  /* ---------- Toggles ---------- */
  const ICON = { cat: 'i-cat', dog: 'i-dog', coffee: 'i-coffee', tea: 'i-tea', day: 'i-day', night: 'i-night' };
  const use = n => `<svg><use href="#${ICON[n]}"/></svg>`;
  document.querySelectorAll('.tg').forEach(t => {
    const a = t.dataset.a, b = t.dataset.b;
    t.innerHTML = `<img class="base" src="ui/base.webp" alt="">
      <span class="hint a">${use(a)}</span><span class="hint b">${use(b)}</span>
      <img class="ring" src="ui/ring.webp" alt="">
      <span class="knob"><img src="ui/knob.webp" alt="">
        <span class="icon a c-${a}">${use(a)}</span><span class="icon b c-${b}">${use(b)}</span></span>`;
  });

  /* ---------- Backgrounds: preload every loop, then crossfade between them ---------- */
  const state = { pet: 'cat', drink: 'coffee', time: 'day' };
  const FILES = ['cat-coffee-day', 'cat-coffee-night', 'cat-tea-day', 'cat-tea-night', 'dog-coffee-day', 'dog-coffee-night', 'dog-tea-day', 'dog-tea-night'];
  const FALLBACK = {}; // e.g. { 'cat-tea-night': 'cat-coffee-night' } if a loop is ever missing
  const vids = {};
  let active = null, z = 1, switching = Promise.resolve();

  const sceneName = () => { const n = `${state.pet}-${state.drink}-${state.time}`; return vids[n] ? n : FALLBACK[n]; };

  async function load(name) {
    const r = await fetch(`bg/${name}.mp4`);
    const url = URL.createObjectURL(await r.blob());
    const v = document.createElement('video');
    Object.assign(v, { src: url, muted: true, loop: true, playsInline: true, preload: 'auto' });
    v.muted = true; v.defaultMuted = true; v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    v.className = 'bg';
    document.getElementById('bgs').appendChild(v);
    await new Promise(res => v.readyState >= 3 ? res() : v.addEventListener('canplaythrough', res, { once: true }));
    vids[name] = v;
  }

  const frameReady = v => new Promise(res => v.requestVideoFrameCallback ? v.requestVideoFrameCallback(() => res()) : setTimeout(res, 60));

  async function show(name) {
    const next = vids[name];
    if (!next || next === active) return;
    if (active) next.currentTime = (active.currentTime + 0.04) % (active.duration || 5.04);
    next.style.zIndex = ++z;
    await next.play().catch(() => {});
    await frameReady(next);
    next.classList.add('show');
    const prev = active; active = next;
    if (prev) setTimeout(() => { if (prev !== active) { prev.classList.remove('show'); prev.pause(); } }, 850);
  }

  Promise.all(FILES.map(load)).then(async () => {
    await show(sceneName());
    stage.classList.remove('loading');
  });

  document.querySelectorAll('.tg').forEach(t => t.addEventListener('click', () => {
    const on = t.getAttribute('aria-checked') !== 'true';
    t.setAttribute('aria-checked', on);
    state[t.dataset.key] = on ? t.dataset.b : t.dataset.a;
    stage.classList.toggle('night', state.time === 'night');
    switching = switching.then(() => show(sceneName()));
  }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && active) active.play().catch(() => {}); });

  /* ---------- TV: YouTube player ---------- */
  // one shuffled playlist per duration; the duration picker switches between them
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const LISTS = {};
  (window.VIDEOS || []).forEach(v => (LISTS[v.bucket] = LISTS[v.bucket] || []).push(v));
  Object.values(LISTS).forEach(shuffle);
  const POS = {};
  let bucket = 'Under 5 min';
  let ALL = LISTS[bucket] || [];
  let idx = 0, player = null, ready = false, muted = false, wokeAt = 0;
  const yt = document.getElementById('yt'), osd = document.getElementById('osd');

  const cv = document.getElementById('static'), cx = cv.getContext('2d'), img = cx.createImageData(cv.width, cv.height);
  let noiseOn = false;
  function noise() {
    if (!noiseOn) return;
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    cx.putImageData(img, 0, 0); requestAnimationFrame(noise);
  }
  function setNoise(on) { const was = noiseOn; noiseOn = on; cv.classList.toggle('on', on); if (on && !was) noise(); }
  setNoise(true);

  function tune(step) {
    if (!ready || !ALL.length) return;
    idx = (idx + step + ALL.length) % ALL.length; POS[bucket] = idx;
    yt.classList.remove('on'); setNoise(true);
    player.loadVideoById(ALL[idx].id);
  }
  function setMuted(m) {
    muted = m;
    if (player && ready) { if (m) player.mute(); else { player.unMute(); player.setVolume(85); player.playVideo(); } }
    osd.classList.toggle('on', m);
  }
  function togglePause() {
    if (!ready) return;
    if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo();
  }

  window.onYouTubeIframeAPIReady = () => {
    if (!ALL.length) return;
    player = new YT.Player('ytp', {
      host: 'https://www.youtube-nocookie.com',
      videoId: ALL[idx].id,
      playerVars: { autoplay: 1, mute: 0, controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3, playsinline: 1, modestbranding: 1, cc_load_policy: 0, origin: location.origin },
      events: {
        onReady: e => {
          ready = true; e.target.unMute(); e.target.setVolume(85); e.target.playVideo();
          // browsers block autoplay with sound on a first visit: if it didn't start, play muted
          // and turn the sound on at the visitor's first click, tap or key press anywhere
          setTimeout(() => {
            const st = e.target.getPlayerState();
            if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) {
              setMuted(true); e.target.playVideo();
              const wake = () => { setMuted(false); wokeAt = Date.now(); ['pointerdown', 'keydown', 'touchstart'].forEach(t => removeEventListener(t, wake, true)); };
              ['pointerdown', 'keydown', 'touchstart'].forEach(t => addEventListener(t, wake, true));
            }
          }, 1500);
        },
        onStateChange: e => {
          if (e.data === YT.PlayerState.PLAYING) setTimeout(() => { yt.classList.add('on'); setNoise(false); }, 150);
          if (e.data === YT.PlayerState.ENDED) tune(1);
        },
        onError: () => tune(1) // embedding disabled or removed: skip it
      }
    });
  };
  const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);

  // screen: pause / resume (the first click after a muted start only turns the sound on)
  document.getElementById('tap').addEventListener('click', () => { if (Date.now() - wokeAt > 800) togglePause(); });

  // next button: pressed artwork while held, at least briefly on a quick tap
  const nextBtn = document.getElementById('next'), pressed = document.getElementById('pressed');
  let downAt = 0;
  const press = () => { downAt = Date.now(); pressed.classList.add('on'); };
  const release = () => setTimeout(() => pressed.classList.remove('on'), Math.max(0, 120 - (Date.now() - downAt)));
  nextBtn.addEventListener('pointerdown', press);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => nextBtn.addEventListener(t, release));
  nextBtn.addEventListener('click', e => { if (e.detail === 0) { press(); release(); } tune(1); });

  // duration picker
  const dur = document.getElementById('dur'), opts = [...dur.querySelectorAll('.opt')];
  function pick(i) {
    if (opts[i].getAttribute('aria-checked') === 'true') return;
    opts.forEach((o, j) => o.setAttribute('aria-checked', j === i));
    dur.dataset.i = i;
    POS[bucket] = idx; bucket = opts[i].dataset.bucket; ALL = LISTS[bucket] || [];
    if (!ready) { idx = 0; return; }
    idx = (POS[bucket] ?? -1); tune(1);
  }
  opts.forEach((o, i) => o.addEventListener('click', () => pick(i)));

  // fullscreen
  const fsBtn = document.getElementById('fs'), root = document.documentElement;
  const fsOn = () => document.fullscreenElement || document.webkitFullscreenElement;
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fsBtn.hidden = true;
  fsBtn.addEventListener('click', () => {
    if (fsOn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (root.requestFullscreen || root.webkitRequestFullscreen).call(root).catch?.(() => {});
  });

  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'n') { press(); release(); tune(1); }
    if (e.key === 'ArrowLeft' || e.key === 'p') tune(-1);
    if (e.key === 'm') setMuted(!muted);
    if (e.key === ' ') { e.preventDefault(); togglePause(); }
  });
})();
</script>
